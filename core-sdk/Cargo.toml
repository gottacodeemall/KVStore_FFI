[package]
name = "kv-core-sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# High-performance concurrent cache - battle-tested, lock-free reads
moka = { version = "0.12", features = ["sync"] }

# HTTP client with connection pooling (both blocking and async)
reqwest = { version = "0.11", features = ["blocking", "json"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# For pinning cached values
parking_lot = "0.12"

# Atomic counters for stats
portable-atomic = { version = "1", features = ["float"] }

# Lazy initialization for global runtime
once_cell = "1"

[build-dependencies]
cbindgen = "0.26"
